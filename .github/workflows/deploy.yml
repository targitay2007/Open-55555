name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: clawcontrol-landing/package-lock.json

      - name: Install dependencies
        working-directory: clawcontrol-landing
        run: npm ci

      - name: Build
        working-directory: clawcontrol-landing
        run: npm run build

      - name: Copy to docs
        run: |
          rm -rf docs
          cp -r clawcontrol-landing/dist docs

      - name: Commit and push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "deploy: update GitHub Pages"
          git push
